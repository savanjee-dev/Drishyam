name: Build Drishyam APK (Candidate Only)

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-drishyam.yml"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: drishyam-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle from Wrapper
        uses: gradle/actions/setup-gradle@v3

      - name: Read app version
        id: app
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$GITHUB_WORKSPACE/android-app"
          test -f "$PROJECT_DIR/settings.gradle.kts" || { echo "::error::Android project settings.gradle.kts not found"; exit 1; }
          GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"
          test -f "$GRADLE_FILE" || { echo "::error::app/build.gradle.kts not found"; exit 1; }
          VERSION_NAME="$(sed -nE 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$GRADLE_FILE" | head -n 1)"
          VERSION_CODE="$(sed -nE 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$GRADLE_FILE" | head -n 1)"
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::Invalid/missing versionName: $VERSION_NAME"; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "::error::Invalid/missing versionCode: $VERSION_CODE"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          CHANGELOG="$PROJECT_DIR/DRISHYAM-$VERSION_NAME-CHANGELOG.txt"
          if [[ -f "$CHANGELOG" ]]; then
            cp "$CHANGELOG" "$GITHUB_WORKSPACE/DRISHYAM-$VERSION_NAME-CHANGELOG.txt"
          else
            printf 'Drishyam %s\n\nRelease notes: proxy-backed photo loading, attribution improvements, and stability refinements.\n' "$VERSION_NAME" > "$GITHUB_WORKSPACE/DRISHYAM-$VERSION_NAME-CHANGELOG.txt"
          fi
          echo "Detected Drishyam $VERSION_NAME (versionCode $VERSION_CODE)."

      - name: Configure Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD secret"; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/drishyam-release-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH" || { echo "::error::Decoded keystore is empty"; exit 1; }
          cp "$KEYSTORE_PATH" "$PROJECT_DIR/app/release-key.jks"
          echo "ANDROID_KEYSTORE_FILE=$PROJECT_DIR/app/release-key.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Configure Firebase
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON" || { echo "::error::Missing GOOGLE_SERVICES_JSON secret"; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$PROJECT_DIR/app/google-services.json"
          python3 -m json.tool "$PROJECT_DIR/app/google-services.json" > /dev/null

      - name: Fix duplicate Android resource
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/src/main/res/values" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path
          res = Path(sys.argv[1])
          base, v21 = res / "strings.xml", res / "strings_v21.xml"
          if base.exists() and v21.exists():
              base_names = {item.get("name") for item in ET.parse(base).getroot() if item.tag in ("string", "item", "plurals", "string-array")}
              v21_tree = ET.parse(v21)
              v21_root = v21_tree.getroot()
              for item in list(v21_root):
                  if item.get("name") == "settings_version" and item.get("name") in base_names:
                      v21_root.remove(item)
              v21_tree.write(v21, encoding="utf-8", xml_declaration=True)
          print("Duplicate resource check completed.")
          PY

      - name: Build release APK
        shell: bash
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace assembleRelease
          APK_SOURCE="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_SOURCE" || { echo "::error::Release APK was not generated"; exit 1; }
          mkdir -p "$RUNNER_TEMP/drishyam-output"
          cp "$APK_SOURCE" "$RUNNER_TEMP/drishyam-output/Drishyam-$VERSION_NAME.apk"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/drishyam-output/Drishyam-$VERSION_NAME.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Verify APK package, version, and ZIP alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/drishyam-output/Drishyam-$VERSION_NAME.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -n 1)"
          test -n "$AAPT" || { echo "::error::aapt not found"; exit 1; }
          test -n "$ZIPALIGN" || { echo "::error::zipalign not found"; exit 1; }
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -F "package: name='com.savan.drishyam' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" <<< "$BADGING" || {
            echo "::error::APK package/version does not match expected metadata"
            "$AAPT" dump badging "$APK" | head -n 1
            exit 1
          }
          "$ZIPALIGN" -c -v 4 "$APK"
          echo "APK package, version metadata, and ZIP alignment verified."

      # Pushes are fast development candidates: compile + signing/package/alignment
      # checks still run, but emulator boot/install is reserved for manual RC builds.
      - name: Install APK on Android emulator (release-candidate smoke test)
        if: github.event_name == 'workflow_dispatch'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          script: |
            set -eu; APK="$GITHUB_WORKSPACE/android-app/app/build/outputs/apk/release/app-release.apk"; test -s "$APK" || { echo "APK not found or empty: $APK"; find "$GITHUB_WORKSPACE/android-app/app/build/outputs/apk" -type f -name '*.apk' -print; exit 1; }; adb wait-for-device; adb install "$APK"; adb shell am force-stop com.savan.drishyam; adb shell monkey -p com.savan.drishyam 1; sleep 5; adb shell dumpsys activity activities | grep -F 'com.savan.drishyam'; adb uninstall com.savan.drishyam

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drishyam-v${{ steps.app.outputs.version_name }}-release
          path: ${{ runner.temp }}/drishyam-output/Drishyam-${{ steps.app.outputs.version_name }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Generate APK checksum
        shell: bash
        run: sha256sum "$RUNNER_TEMP/drishyam-output/Drishyam-$VERSION_NAME.apk" > "$RUNNER_TEMP/drishyam-output/Drishyam-$VERSION_NAME.apk.sha256"

      - name: Upload APK checksum
        uses: actions/upload-artifact@v4
        with:
          name: Drishyam-v${{ steps.app.outputs.version_name }}-candidate-checksum
          path: ${{ runner.temp }}/drishyam-output/Drishyam-${{ steps.app.outputs.version_name }}.apk.sha256
          if-no-files-found: error
          retention-days: 30
