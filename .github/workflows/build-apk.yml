name: Build Drishyam APK (Candidate Only)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find and extract project zip
        run: |
          ZIP=$(for f in drishyam-android-project-*.zip; do [ -f "$f" ] && echo "$(echo "$f" | tr '_' '.')|$f"; done | sort -V | tail -n 1 | cut -d'|' -f2)
          if [ -z "$ZIP" ]; then
            echo "No drishyam-android-project zip found in repository root" >&2
            exit 1
          fi
          echo "Using $ZIP"
          mkdir -p source
          unzip -q "$ZIP" -d source

      - name: Configure Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Missing repository secret GOOGLE_SERVICES_JSON" >&2
            exit 1
          fi
          mkdir -p source/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > source/app/google-services.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build APK
        working-directory: source
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Drishyam-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
