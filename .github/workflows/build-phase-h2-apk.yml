name: Phase H2 Candidate APK (No Release) # triggered after H2 home/search/sort integration

on:
  workflow_dispatch:
  push:
    branches:
      - phase-h2-splash-home-transition-fixed
    paths:
      - .github/workflows/build-phase-h2-apk.yml

permissions:
  contents: read

concurrency:
  group: drishyam-h2-candidate
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout corrected H2 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Validate source baseline and version
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "phase-h2-splash-home-transition-fixed"
          test -f android-app/settings.gradle.kts
          test -f android-app/gradlew
          grep -F 'applicationId = "com.savan.drishyam"' android-app/app/build.gradle.kts
          grep -F 'versionCode = 44' android-app/app/build.gradle.kts
          grep -F 'versionName = "2.7.16"' android-app/app/build.gradle.kts
          echo "Building corrected H2 branch at $GITHUB_SHA"

      - name: Configure release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/drishyam-release-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          cp "$KEYSTORE" android-app/app/release-key.jks
          {
            echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/android-app/app/release-key.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Configure Firebase
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > android-app/app/google-services.json
          python3 -m json.tool android-app/app/google-services.json > /dev/null

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          cd android-app
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          mkdir -p "$RUNNER_TEMP/h2-output"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/h2-output/Drishyam-H2-2.7.16.apk"

      - name: Verify signature, package, version and alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/h2-output/Drishyam-H2-2.7.16.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER" && test -n "$AAPT" && test -n "$ZIPALIGN"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -F "package: name='com.savan.drishyam' versionCode='44' versionName='2.7.16'" <<< "$BADGING"
          "$ZIPALIGN" -c -v 4 "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload candidate APK and checksum (no release)
        uses: actions/upload-artifact@v4
        with:
          name: Drishyam-H2-candidate-2.7.16
          path: |
            ${{ runner.temp }}/h2-output/Drishyam-H2-2.7.16.apk
            ${{ runner.temp }}/h2-output/Drishyam-H2-2.7.16.apk.sha256
          if-no-files-found: error
          retention-days: 14
