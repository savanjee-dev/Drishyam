name: Build and Release Drishyam APK

on:
  workflow_dispatch:
  push:
    paths:
      - "drishyam-android-project-v2.4.3-styled.zip"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Extract v2.4.3 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="drishyam-android-project-v2.4.3-styled.zip"
          test -f "$ZIP_FILE" || { echo "::error::Source ZIP not found: $ZIP_FILE"; exit 1; }
          mkdir -p "$RUNNER_TEMP/drishyam-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/drishyam-source"
          PROJECT_DIR="$(find "$RUNNER_TEMP/drishyam-source" -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR" || { echo "::error::Could not find settings.gradle.kts in source ZIP"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Check app version and changelog
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"
          CHANGELOG="$PROJECT_DIR/DRISHYAM-2.4.3-CHANGELOG.txt"
          test -f "$GRADLE_FILE"
          test -f "$CHANGELOG"
          grep -q 'versionName = "2.4.3"' "$GRADLE_FILE" || { echo "::error::Expected versionName 2.4.3"; exit 1; }
          grep -q 'versionCode = 14' "$GRADLE_FILE" || { echo "::error::Expected versionCode 14"; exit 1; }
          cp "$CHANGELOG" "$GITHUB_WORKSPACE/DRISHYAM-2.4.3-CHANGELOG.txt"
          echo "Version and changelog checks passed."

      - name: Configure Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/drishyam-release-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          cp "$KEYSTORE_PATH" "$PROJECT_DIR/app/release-key.jks"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Configure Firebase
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$PROJECT_DIR/app/google-services.json"
          python3 -m json.tool "$PROJECT_DIR/app/google-services.json" > /dev/null

      - name: Build release APK
        shell: bash
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleRelease
          APK_SOURCE="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_SOURCE" || { echo "::error::Release APK was not generated"; exit 1; }
          mkdir -p "$RUNNER_TEMP/drishyam-output"
          cp "$APK_SOURCE" "$RUNNER_TEMP/drishyam-output/Drishyam-2.4.3.apk"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/drishyam-output/Drishyam-2.4.3.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drishyam-v2.4.3-release
          path: ${{ runner.temp }}/drishyam-output/Drishyam-2.4.3.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.3
          name: Drishyam 2.4.3
          files: |
            DRISHYAM-2.4.3-CHANGELOG.txt
            ${{ runner.temp }}/drishyam-output/Drishyam-2.4.3.apk
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
