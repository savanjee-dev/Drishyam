name: Phase 3 APK Build (No Release)
# CI-only test artifact; do not publish a production release.
# Dedicated test build only; intentionally does not publish a GitHub Release.

on:
  workflow_dispatch:
  push:
    branches: ["ci/phase1-splash-build", "phase2/home-header-search-sort", "phase3/material3-expressive-v3.0"]
    paths:
      - "android-app/**"
      - ".github/workflows/build-phase1-apk.yml"

permissions:
  contents: read

jobs:
  build-phase1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Validate baseline version
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$GITHUB_WORKSPACE/android-app"
          GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"
          VERSION_NAME="$(sed -nE 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$GRADLE_FILE" | head -n 1)"
          VERSION_CODE="$(sed -nE 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$GRADLE_FILE" | head -n 1)"
          test "$VERSION_NAME" = "3.0"
          test "$VERSION_CODE" = "45"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building isolated Phase 3 v3.0 test APK only; no release or tag will be published."

      - name: Configure Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/drishyam-release-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          cp "$KEYSTORE_PATH" "$PROJECT_DIR/app/release-key.jks"
          echo "ANDROID_KEYSTORE_FILE=$PROJECT_DIR/app/release-key.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Configure Firebase
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$PROJECT_DIR/app/google-services.json"
          python3 -m json.tool "$PROJECT_DIR/app/google-services.json" > /dev/null

      - name: Validate Android XML and Phase 3 resources
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/src/main/res" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = Path(sys.argv[1])
          for path in root.rglob("*.xml"):
              ET.parse(path)
          required = ["layout/view_launch_splash.xml", "drawable/splash_radial_background.xml", "drawable/splash_glow.xml", "drawable/splash_ring.xml", "drawable/splash_progress_track.xml", "drawable/splash_progress_fill.xml"]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit("Missing Phase 1 resources: " + ", ".join(missing))
          print("XML parsing and Phase 3 resource checks passed.")
          PY

      - name: Build signed release-variant APK for testing
        shell: bash
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleRelease
          APK_SOURCE="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_SOURCE"
          mkdir -p "$RUNNER_TEMP/drishyam-phase3-output"
          cp "$APK_SOURCE" "$RUNNER_TEMP/drishyam-phase2-output/Drishyam-v3.0-Phase3.apk"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/drishyam-phase2-output/Drishyam-Phase2.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: Drishyam-v3.0-Phase3-Test-APK
          path: ${{ runner.temp }}/drishyam-phase2-output/Drishyam-Phase2.apk
          if-no-files-found: error
          retention-days: 30
