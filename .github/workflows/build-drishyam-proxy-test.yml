name: Drishyam Proxy Integration Test Build

on:
  push:
    branches:
      - fix/verified-update-downloads
    paths:
      - "android-app/**"
      - ".github/workflows/build-drishyam-proxy-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Configure Firebase for isolated test package
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON" || { echo "::error::Missing GOOGLE_SERVICES_JSON secret"; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON" > android-app/app/google-services.json
          python3 -m json.tool android-app/app/google-services.json > /dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("android-app/app/google-services.json")
          data = json.loads(p.read_text())
          found = False
          for client in data.get("client", []):
              android = client.get("client_info", {}).get("android_client_info", {})
              if android.get("package_name") == "com.savan.drishyam":
                  android["package_name"] = "com.savan.drishyam.proxytest"
                  found = True
          if not found:
              raise SystemExit("Could not find Firebase client for com.savan.drishyam")
          p.write_text(json.dumps(data, indent=2) + "\n")
          gradle = Path("android-app/app/build.gradle.kts")
          source = gradle.read_text()
          old = 'applicationId = "com.savan.drishyam"'
          new = 'applicationId = "com.savan.drishyam.proxytest"'
          if source.count(old) != 1:
              raise SystemExit("Expected exactly one applicationId declaration to update")
          gradle.write_text(source.replace(old, new))
          PY

      - name: Build isolated debug APK (preserves existing installation)
        shell: bash
        run: |
          set -euo pipefail
          cd android-app
          gradle --no-daemon assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload isolated test APK
        uses: actions/upload-artifact@v4
        with:
          name: Drishyam-v2.7.11-proxy-isolated-test
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
