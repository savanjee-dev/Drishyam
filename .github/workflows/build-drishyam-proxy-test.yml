name: Drishyam Proxy Integration Test Build

on:
  push:
    branches:
      - security/unsplash-proxy-integration
    paths:
      - "android-app/**"
      - ".github/workflows/build-drishyam-proxy-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Configure Firebase
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON" || { echo "::error::Missing GOOGLE_SERVICES_JSON secret"; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON" > android-app/app/google-services.json
          python3 -m json.tool android-app/app/google-services.json > /dev/null

      - name: Build debug APK (no release publication)
        shell: bash
        run: |
          set -euo pipefail
          cd android-app
          gradle --no-daemon assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Drishyam-proxy-integration-test
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
