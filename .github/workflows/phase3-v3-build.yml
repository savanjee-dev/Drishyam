name: Drishyam Phase 3 v3.0 Test APK

on:
  push:
    branches:
      - phase3/material3-expressive-v3.0
    paths:
      - '.github/workflows/phase3-v3-build.yml'
      - 'android-app/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-phase3:
    name: Build and verify Phase 3 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 3 branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate target version
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -nE 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)" = "3.0"
          test "$(sed -nE 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)" = "45"

      - name: Configure signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/drishyam-release-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          cp "$KEYSTORE_PATH" android-app/app/release-key.jks
          {
            echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/android-app/app/release-key.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Configure Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > android-app/app/google-services.json
          python3 -m json.tool android-app/app/google-services.json >/dev/null

      - name: Validate Android XML resources
        run: |
          set -euo pipefail
          python3 - android-app/app/src/main/res <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = Path(sys.argv[1])
          for path in root.rglob("*.xml"):
              ET.parse(path)
          required = [
              "layout/view_launch_splash.xml",
              "drawable/splash_radial_background.xml",
              "drawable/splash_glow.xml",
              "drawable/splash_ring.xml",
              "drawable/splash_progress_track.xml",
              "drawable/splash_progress_fill.xml",
          ]
          missing = [item for item in required if not (root / item).is_file()]
          if missing:
              raise SystemExit("Missing required splash resources: " + ", ".join(missing))
          print("Android XML and required splash resources validated.")
          PY

      - name: Build signed release APK
        working-directory: android-app
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          set -euo pipefail
          gradle --no-daemon assembleRelease
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_SOURCE"
          mkdir -p "$RUNNER_TEMP/drishyam-phase3-output"
          cp "$APK_SOURCE" "$RUNNER_TEMP/drishyam-phase3-output/Drishyam-v3.0-Phase3.apk"
          test -s "$RUNNER_TEMP/drishyam-phase3-output/Drishyam-v3.0-Phase3.apk"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$RUNNER_TEMP/drishyam-phase3-output/Drishyam-v3.0-Phase3.apk"

      - name: Upload verified test APK
        uses: actions/upload-artifact@v4
        with:
          name: Drishyam-v3.0-Phase3-test-APK
          path: ${{ runner.temp }}/drishyam-phase3-output/Drishyam-v3.0-Phase3.apk
          if-no-files-found: error
          retention-days: 14
