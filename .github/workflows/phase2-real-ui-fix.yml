name: Drishyam Phase 2 Isolated Install Build

on:
  push:
    branches: ["phase2/debug-build"]
    paths:
      - ".github/workflows/phase2-real-ui-fix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Extract Phase 2 source archive
        shell: bash
        run: |
          set -euo pipefail
          unzip -q Drishyam_Phase2_Source_Alternate.zip -d phase2-source
          PROJECT_DIR="$(find phase2-source -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Apply safe temporary build fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/src/main/res/layout/activity_main.xml" "$PROJECT_DIR/app/build.gradle.kts" <<'PY'
          import pathlib, sys
          layout = pathlib.Path(sys.argv[1])
          s = layout.read_text()
          old = 'android:id="@+id/sortIndicator" android:layout_width="1dp" android:layout_height="match_parent"'
          new = 'android:id="@+id/sortIndicator" android:layout_width="1dp" android:layout_height="44dp"'
          if old in s:
              s = s.replace(old, new, 1)
              layout.write_text(s)
          elif new not in s:
              raise SystemExit("sortIndicator declaration differs from expected source; refusing to guess.")
          gradle = pathlib.Path(sys.argv[2])
          g = gradle.read_text()
          g = g.replace('    id("com.google.gms.google-services")\n', '', 1)
          # Explicitly set a separate package ID in this temporary debug build.
          # It cannot replace or update the installed production app.
          if 'applicationId = "com.savan.drishyam.phase2debug"' not in g:
              g += '\nandroid { defaultConfig { applicationId = "com.savan.drishyam.phase2debug" } }\n'
          gradle.write_text(g)
          PY
          grep -q 'applicationId = "com.savan.drishyam.phase2debug"' "$PROJECT_DIR/app/build.gradle.kts"
      - name: Build isolated debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug --stacktrace
      - name: Upload isolated APK
        uses: actions/upload-artifact@v4
        with:
          name: drishyam-phase2-isolated-install-apk
          path: phase2-source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
