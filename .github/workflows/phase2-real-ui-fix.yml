name: Drishyam Phase 2 Real UI Fix Build

on:
  push:
    branches: ["phase2/debug-build"]
    paths:
      - ".github/workflows/phase2-real-ui-fix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Extract exact Phase 2 source archive
        shell: bash
        run: |
          set -euo pipefail
          unzip -q Drishyam_Phase2_Source_Alternate.zip -d phase2-source
          PROJECT_DIR="$(find phase2-source -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"
      - name: Fix oversized sort indicator in temporary build source
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/src/main/res/layout/activity_main.xml" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          old = 'android:id="@+id/sortIndicator" android:layout_width="1dp" android:layout_height="match_parent"'
          new = 'android:id="@+id/sortIndicator" android:layout_width="1dp" android:layout_height="44dp"'
          if old not in s:
              raise SystemExit("Expected sortIndicator layout declaration not found; refusing unsafe patch.")
          p.write_text(s.replace(old, new, 1))
          print("Fixed sort indicator height from match_parent to 44dp.")
          PY
      - name: Remove Firebase plugin from temporary build copy only
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/build.gradle.kts" <<'PY'
          import pathlib, sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          target='    id("com.google.gms.google-services")\n'
          if target in s: p.write_text(s.replace(target, "", 1))
          PY
      - name: Build side-by-side debug APK
        shell: bash
        run: |
          set -euo pipefail
          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"
          python3 - "$APP_GRADLE" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          marker='android {'
          if marker not in s: raise SystemExit("Android block not found")
          suffix='\n// Temporary test-only application ID; leaves installed Drishyam untouched.\nandroid { buildTypes { getByName("debug") { applicationIdSuffix = ".phase2debug" } } }\n'
          p.write_text(s+suffix)
          PY
          gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug --stacktrace
      - name: Upload corrected debug APK
        uses: actions/upload-artifact@v4
        with:
          name: drishyam-phase2-real-ui-fix-apk
          path: phase2-source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
