
name: Build Drishyam APK (Legacy Candidate Only)

on:
  workflow_dispatch:
  push:
    paths:
      - "drishyam-android-project-v2.4.2-styled.zip"
      - ".github/workflows/build-from-zip.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Extract v2.4.2 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="drishyam-android-project-v2.4.2-styled.zip"
          test -f "$ZIP_FILE" || {
            echo "::error::Source ZIP not found: $ZIP_FILE"
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/drishyam-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/drishyam-source"

          PROJECT_DIR="$(find "$RUNNER_TEMP/drishyam-source" -name settings.gradle.kts -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR" || {
            echo "::error::Could not find settings.gradle.kts in source ZIP"
            exit 1
          }

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Check app version and changelog
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"
          CHANGELOG="$PROJECT_DIR/DRISHYAM-2.4.2-CHANGELOG.txt"

          test -f "$GRADLE_FILE"
          test -f "$CHANGELOG"

          grep -q 'versionName = "2.4.2"' "$GRADLE_FILE" || {
            echo "::error::Expected versionName 2.4.2"
            exit 1
          }

          grep -q 'versionCode = 13' "$GRADLE_FILE" || {
            echo "::error::Expected versionCode 13"
            exit 1
          }

          echo "Version and changelog checks passed."

      - name: Configure Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          KEYSTORE_PATH="$RUNNER_TEMP/drishyam-release-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          cp "$KEYSTORE_PATH" "$PROJECT_DIR/app/release-key.jks"

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Configure Firebase
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$PROJECT_DIR/app/google-services.json"
          python3 -m json.tool "$PROJECT_DIR/app/google-services.json" > /dev/null
      
      - name: Fix duplicate Android resource
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          res = Path(sys.argv[1]) / "app/src/main/res/values"
          base = res / "strings.xml"
          v21 = res / "strings_v21.xml"

          if base.exists() and v21.exists():
              base_root = ET.parse(base).getroot()
              v21_tree = ET.parse(v21)
              v21_root = v21_tree.getroot()

              base_names = {
                  item.get("name")
                  for item in base_root
                  if item.tag in ("string", "item", "plurals", "string-array")
              }

              for item in list(v21_root):
                  if (
                      item.get("name") == "settings_version"
                      and item.get("name") in base_names
                  ):
                      v21_root.remove(item)

              v21_tree.write(
                  v21,
                  encoding="utf-8",
                  xml_declaration=True
              )

          print("Duplicate resource check completed.")
          PY

      - name: Build release APK
        shell: bash
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleRelease

          APK_SOURCE="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_SOURCE" || {
            echo "::error::Release APK was not generated"
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/drishyam-output"
          cp "$APK_SOURCE" "$RUNNER_TEMP/drishyam-output/Drishyam-2.4.2.apk"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/drishyam-output/Drishyam-2.4.2.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drishyam-v2.4.2-release
          path: ${{ runner.temp }}/drishyam-output/Drishyam-2.4.2.apk
          if-no-files-found: error
          retention-days: 30

