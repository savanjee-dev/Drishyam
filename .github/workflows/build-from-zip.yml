
name: Build Drishyam APK from ZIP

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-from-zip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          zips=(drishyam-android-project-v2.3.zip)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "Project ZIP not found in repository root."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/drishyam-project"
          unzip -q "${zips[0]}" -d "$RUNNER_TEMP/drishyam-project"

          project_dir="$(find "$RUNNER_TEMP/drishyam-project" \
            -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -printf '%h\n' | head -n 1)"

          if [ -z "$project_dir" ]; then
            echo "Could not find Gradle settings file."
            find "$RUNNER_TEMP/drishyam-project" -maxdepth 4 -type f | head -80
            exit 1
          fi

          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Project directory: $project_dir"

      - name: Configure Firebase
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret is empty."
            exit 1
          fi

          app_dir="$PROJECT_DIR/app"
          mkdir -p "$app_dir"

          printf '%s' "$GOOGLE_SERVICES_JSON" \
            > "$app_dir/google-services.json"

          python3 -m json.tool "$app_dir/google-services.json" >/dev/null
          echo "Firebase configuration file created."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Drishyam-APK
          path: ${{ runner.temp }}/drishyam-project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
